<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Sulaiman Nasser — AI systems, developer tools, operator dashboards">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3880f0"/>
      <stop offset="1" stop-color="#7aa7ff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <circle cx="1080" cy="40" r="180" fill="#3880f0" opacity="0.10" filter="url(#soft)"/>
  <circle cx="180" cy="330" r="160" fill="#3880f0" opacity="0.06" filter="url(#soft)"/>
  <rect x="0" y="0" width="1280" height="4" fill="url(#accent)"/>

  <g font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">
    <text x="80" y="132" font-size="16" fill="#7aa7ff" letter-spacing="6" font-weight="600">SOFTWARE ENGINEER</text>
    <text x="78" y="204" font-size="66" font-weight="700" fill="#f0f3f6" letter-spacing="1">SOOPHERE</text>
    <text x="82" y="246" font-size="23" fill="#9aa4b2">AI systems · developer tools · operator dashboards</text>
    <text x="82" y="284" font-size="16" fill="#6b7684">Muscat, Oman · open to software &amp; AI engineering opportunities</text>
  </g>

  <g transform="translate(880,72)">
    <g>
      <rect x="0" y="0" width="320" height="52" rx="10" fill="#1b222c" stroke="#2b3441"/>
      <circle cx="24" cy="26" r="4" fill="#3880f0"/>
      <text x="40" y="32" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="16" fill="#c9d1d9">Measured, not guessed</text>
    </g>
    <g>
      <rect x="0" y="66" width="320" height="52" rx="10" fill="#1b222c" stroke="#2b3441"/>
      <circle cx="24" cy="92" r="4" fill="#3880f0"/>
      <text x="40" y="98" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="16" fill="#c9d1d9">Thirteen pages, no framework</text>
    </g>
    <g>
      <rect x="0" y="132" width="320" height="52" rx="10" fill="#1b222c" stroke="#2b3441"/>
      <circle cx="24" cy="158" r="4" fill="#3880f0"/>
      <text x="40" y="164" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="16" fill="#c9d1d9">Agents in the loop, verified</text>
    </g>
  </g>
</svg>
